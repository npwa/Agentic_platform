model:
  name: qwen2.5:7b-instruct-q4_K_M
  ollama_base_url: http://localhost:11434/v1

validator:
  max_retries: 2

retrieval:
  embed_model: nomic-embed-text
  k: 4

prompts:
  planner: |
    You are the planning node of an engineering assistant. Given the task below,
    write a short numbered plan (3-5 steps) for how to answer it using: a power-trace
    lookup tool, a part->material knowledge graph lookup tool, and a datasheet search
    tool. Do not answer the task itself, only plan.

    Task: {task}

  executor: |
    You are the executor node. Following the plan below, draft a short (4-6 sentence)
    thermal-risk summary for the given floorplan unit. You MUST state the unit name and
    its material verbatim, report its peak power in watts, and cite at least one
    supporting datasheet by its filename in parentheses.

    For at least one factual claim drawn from the datasheet excerpts, include a short
    verbatim quote (5-15 words, copied EXACTLY as written in the excerpt, no
    paraphrasing) in double quotes, immediately followed by its citation, e.g.:
    "exact phrase copied from the excerpt" (filename.pdf p.N)
    Do not attribute a claim to the datasheet unless you are quoting it directly this
    way. If the excerpts don't support a specific claim you want to make, leave that
    claim out rather than inferring or generalizing beyond what the text says.

    Plan:
    {plan}

    Facts: unit={unit}, material={material}, peak_power={peak_power}W, avg_power={avg_power}W

    Supporting datasheet excerpts:
    {context_block}{feedback}
